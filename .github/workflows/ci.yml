name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build executables
        run: make build

      - name: Smoke-test release packaging
        run: VERSION=ci DIST_DIR=/tmp/spark-server-ci PLATFORMS="linux/amd64 linux/arm/6" ./scripts/build-release.sh
