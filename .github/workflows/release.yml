name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version or snapshot label"
        required: false
        default: "snapshot"

permissions:
  contents: write

jobs:
  package:
    name: Build release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Resolve release version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          elif [ -n "$INPUT_VERSION" ]; then
            echo "VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
          else
            echo "VERSION=snapshot" >> "$GITHUB_ENV"
          fi

      - name: Build release archives
        run: make release

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spark-server-dist
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/*.tar.gz \
              dist/checksums.txt \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
